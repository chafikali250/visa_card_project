name: Visa Card Service CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Stage 2: Install Dependencies (npm ci)
      - name: Install Dependencies
        run: npm ci

      # Stage 3: Run Tests (npm test)
      - name: Run Tests
        run: npm test

      # Stage 4: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Stage 5: Build & Push Docker Image (chali250/visa_card_project)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/visa_card_project:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/visa_card_project:${{ github.run_number }}
